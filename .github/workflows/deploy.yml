name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # --base './'：打包出的 JS/CSS 走相对路径，适配 GitHub Pages 子目录
        # CLIENT_BASE_PATH：让运行时 resolveAppUrl() 拼出的绝对 URL 与 BrowserRouter
        # 的 basename 正确带上仓库子路径 /Hybrid-Matter，否则图片/视频会 404
        env:
          CLIENT_BASE_PATH: /Hybrid-Matter
        run: npx vite build --base './' --outDir dist/gh-pages

      - name: Sanitize HTML for standalone hosting
        # 清理平台注入的脚本与模板占位符，注入自适应 basename
        run: node public/sanitize-standalone.js

      - name: Add .nojekyll
        run: touch dist/gh-pages/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/gh-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
